<!doctype html>
<!-- Partner Summit EMEA 2026 — Sponsors. Keep this file and the five logo
     files in the same GitHub folder before embedding it as an iframe. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Partner Summit EMEA 2026 — Sponsors</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Domine:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--ivory:#FCF6EA;--ink:#2B2521;--ink2:#6b5a49;--cherry:#D6456A;--orange:#F0872F;--gold:#B4891E;--grad:linear-gradient(120deg,#F5943A,#E0466A 62%,#C2325C)}
    *{box-sizing:border-box;margin:0} html,body{height:100%;background:rgb(255,232,191)}
    body{color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
    .stage{position:relative;min-height:340px;height:100%;display:flex;align-items:center;overflow:hidden}
    .stage::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;background:radial-gradient(60% 90% at 100% 0%,rgba(240,135,47,.14),transparent 60%)}
    .wrap{position:relative;z-index:1;width:100%;max-width:1180px;margin:auto;padding:clamp(30px,5vw,54px);display:grid;grid-template-columns:1fr 1.02fr;gap:clamp(28px,5vw,60px);align-items:center}
    .kick{display:flex;align-items:center;gap:11px;font-weight:600;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--cherry);margin-bottom:16px}.kick::before{content:"";width:24px;height:2px;background:var(--cherry)}
    h2{font-family:Domine,serif;font-weight:700;font-size:clamp(28px,3.6vw,44px);line-height:1.03;letter-spacing:-.01em}.i{font-style:italic}.lede{margin-top:16px;font-size:clamp(14px,1.35vw,16px);line-height:1.6;color:var(--ink2);max-width:44ch}
    .ticket{position:relative;background:var(--ivory);border-radius:18px;padding:clamp(26px,3vw,34px) clamp(30px,3.4vw,42px);--nr:15px;-webkit-mask:radial-gradient(circle var(--nr) at left,#0000 98%,#000) left/50.5% 100% no-repeat,radial-gradient(circle var(--nr) at right,#0000 98%,#000) right/50.5% 100% no-repeat;mask:radial-gradient(circle var(--nr) at left,#0000 98%,#000) left/50.5% 100% no-repeat,radial-gradient(circle var(--nr) at right,#0000 98%,#000) right/50.5% 100% no-repeat}
    .thead{margin-bottom:14px}.tk{font-weight:700;font-size:10px;letter-spacing:.2em;text-transform:uppercase}.premier .tk{color:var(--cherry)}.gold .tk{color:var(--gold)}.perf{margin:clamp(18px,2.4vw,24px) 0;border-top:2px dotted rgba(43,37,33,.2)}
    .logos{display:flex;flex-wrap:wrap;align-items:center;gap:clamp(24px,3vw,42px)}.logo{display:inline-flex;align-items:center}.logo img{display:block;width:auto;max-width:150px;object-fit:contain}.logo.premier img{height:clamp(42px,5vw,58px);max-width:190px}.logo.gold img{height:clamp(24px,2.6vw,33px)}
    @media (max-width:760px){body{overflow:auto}.stage{height:auto;min-height:0}.wrap{grid-template-columns:1fr;gap:24px;padding:34px 24px}.logo.gold img{max-width:120px}}
  </style>
</head>
<body>
  <section class="stage">
    <div class="wrap">
      <div class="intro">
        <p class="kick">Our partners</p>
        <h2>Thank you to our <span class="i">sponsors.</span></h2>
        <p class="lede">Partner Summit is built alongside the organisations powering the Bob Economy &mdash; thank you for helping shape the journey with us.</p>
      </div>
      <div class="ticket">
        <div class="tier premier">
          <div class="thead"><span class="tk">Premier sponsor</span></div>
          <div class="logos"><span class="logo premier"><img src="Oyster.svg" alt="Oyster"></span></div>
        </div>
        <div class="perf"></div>
        <div class="tier gold">
          <div class="thead"><span class="tk">Gold sponsors</span></div>
          <div class="logos">
            <span class="logo gold"><img src="Pebl.svg" alt="Pebl"></span>
            <span class="logo gold"><img src="Multiplier.png" alt="Multiplier"></span>
            <span class="logo gold"><img src="Perk.svg" alt="Perk"></span>
            <span class="logo gold"><img src="papaya.png" alt="Papaya Global"></span>
          </div>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
