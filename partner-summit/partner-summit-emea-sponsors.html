    *{box-sizing:border-box;margin:0} html,body{height:100%;background:transparent}
    body{color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
    .stage{position:relative;min-height:340px;height:100%;display:flex;align-items:center;overflow:hidden}

    .ticket{position:relative;background:var(--ivory);border-radius:18px;padding:clamp(26px,3vw,34px) clamp(30px,3.4vw,42px);--nr:15px;-webkit-mask:radial-gradient(circle var(--nr) at left,#0000 98%,#000) left/50.5% 100% no-repeat,radial-gradient(circle var(--nr) at right,#0000 98%,#000) right/50.5% 100% no-repeat;mask:radial-gradient(circle var(--nr) at left,#0000 98%,#000) left/50.5% 100% no-repeat,radial-gradient(circle var(--nr) at right,#0000 98%,#000) right/50.5% 100% no-repeat}
    .thead{margin-bottom:14px}.tk{font-weight:700;font-size:10px;letter-spacing:.2em;text-transform:uppercase}.premier .tk{color:var(--cherry)}.gold .tk{color:var(--gold)}.perf{margin:clamp(18px,2.4vw,24px) 0;border-top:2px dotted rgba(43,37,33,.2)}
    .logos{display:flex;flex-wrap:wrap;align-items:center;gap:clamp(24px,3vw,42px)}.logo{display:inline-flex;align-items:center}.logo img{display:block;width:auto;max-width:150px;object-fit:contain}.logo.premier img{height:clamp(42px,5vw,58px);max-width:190px}.logo.gold img{height:clamp(24px,2.6vw,33px)}
    @media (max-width:760px){body{overflow:auto}.stage{height:auto;min-height:0}.wrap{grid-template-columns:1fr;gap:24px;padding:34px 24px}.logo.gold img{max-width:120px}}
  </style>
