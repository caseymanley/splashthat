<!doctype html>
<!-- ============================================================
     PARTNER SUMMIT US 2026 — SPONSORS (self-contained iframe)
     Styled to the Partner Summit site (Palm Beach / boarding-pass theme):
     warm ivory-peach ground, slab-serif charcoal heading, coral kicker,
     sunrise gradient, logos in a notched "ticket stub". Distinct from Horizons.
     Host on GitHub Pages; embed via <iframe src="...">. Height ~380px desktop.
     ============================================================ -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Partner Summit US 2026 — Sponsors</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Domine:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#F8EDD7;--bg2:#F1DEBE;--ivory:#FCF6EA;--ink:#2B2521;--ink2:#6b5a49;
    --cherry:#D6456A;--orange:#F0872F;--tan:#A5805A;
    --grad:linear-gradient(120deg,#F5943A,#E0466A 62%,#C2325C);
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  html,body{background:rgb(255, 232, 191)}
  body{background:rgb(255, 232, 191);color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
  .stage{position:relative;height:100%;min-height:340px;display:flex;align-items:center;overflow:hidden}
  /* faint travel line-work, top-right (echoes the hero routes) */
  .stage::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
    background:radial-gradient(60% 90% at 100% 0%, rgba(240,135,47,.14), transparent 60%)}

  .wrap{position:relative;z-index:1;width:100%;max-width:1180px;margin:0 auto;
    padding:clamp(30px,5vw,54px);display:grid;grid-template-columns:1fr 1.02fr;gap:clamp(28px,5vw,60px);
    align-items:center}

  .kick{display:flex;align-items:center;gap:11px;font-family:'Inter',sans-serif;font-weight:600;
    font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--cherry);margin-bottom:16px}
  .kick::before{content:"";width:24px;height:2px;background:var(--cherry);flex:0 0 auto}
  h2{font-family:'Domine',serif;font-weight:700;font-size:clamp(28px,3.6vw,44px);line-height:1.03;
    letter-spacing:-.01em;color:var(--ink)}
  h2 .i{font-style:italic}
  .lede{margin-top:16px;font-size:clamp(14px,1.35vw,16px);line-height:1.6;color:var(--ink2);max-width:44ch}

  /* ---- TICKET STUB (notched card + perforation) ---- */
  .ticket{position:relative;background:var(--ivory);border-radius:18px;
    padding:clamp(26px,3vw,34px) clamp(30px,3.4vw,42px);
    --nr:15px;
    -webkit-mask:
      radial-gradient(circle var(--nr) at left, #0000 98%, #000) left/50.5% 100% no-repeat,
      radial-gradient(circle var(--nr) at right, #0000 98%, #000) right/50.5% 100% no-repeat;
    mask:
      radial-gradient(circle var(--nr) at left, #0000 98%, #000) left/50.5% 100% no-repeat,
      radial-gradient(circle var(--nr) at right, #0000 98%, #000) right/50.5% 100% no-repeat;}
  .thead{display:flex;align-items:center;gap:11px}
  .thead .tk{font-family:'Inter',sans-serif;font-weight:600;font-size:10px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--tan)}
  .perf{margin:clamp(18px,2.4vw,24px) 0;border-top:2px dotted rgba(43,37,33,.2)}
  .logos{display:flex;flex-wrap:wrap;align-items:center;gap:clamp(28px,3.5vw,46px)}
  .logo{position:relative;display:inline-flex;align-items:center}
  .logo.sm svg,.logo.sm svg *{fill:var(--ink)}
  .logo svg{display:block;width:auto}
  .logo.big svg{height:clamp(40px,4.8vw,58px)}
  .logo.sm svg{height:clamp(24px,2.6vw,33px)}

  @media (max-width:760px){
    body{overflow:auto}.stage{min-height:0}
    .wrap{grid-template-columns:1fr;gap:24px;padding:34px 24px}
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="wrap">
      <div class="intro">
        <p class="kick">Our partners</p>
        <h2>Thank you to our <span class="i">sponsors.</span></h2>
        <p class="lede">Partner Summit is built alongside the organisations powering the Bob Economy &mdash; thank you for helping shape the journey with us.</p>
      </div>
