<!doctype html>
<!-- ============================================================
     HORIZONS 2026 — SPONSORS (self-contained iframe)
     Host on GitHub Pages + embed via <iframe src="...">.
     Suggested height: ~360px desktop / auto-stacks on mobile (~640px).
     Logos are single-colour SVGs tinted cream via CSS. Add more by copying a
     .logo block into the right tier. NOTE: confirm "outstail.svg" is the Oyster
     mark — the filename was unusual.
     ============================================================ -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Horizons 2026 — Sponsors</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Domine:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--wine:#3D001A;--wine2:#60032A;--cherry:#EE164F;--orange:#FAA32B;--cream:#FDF6EB;--cocoa:#B0093C;}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:var(--wine);color:var(--cream);font-family:'Domine',serif;
    -webkit-font-smoothing:antialiased;overflow:hidden}
  /* soft sunrise glow, top-right */
  .stage{position:relative;height:100%;min-height:320px;overflow:hidden;
    display:flex;align-items:center}
  .stage::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(85% 130% at 92% 6%, rgba(250,163,43,.16), rgba(238,22,79,.07) 34%, transparent 64%)}
  /* faint horizon dot texture */
  .stage::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
    background-image:radial-gradient(rgba(253,246,235,.05) 1px, transparent 1.4px);background-size:6px 6px}

  .wrap{position:relative;z-index:1;width:100%;max-width:1200px;margin:0 auto;
    padding:clamp(30px,5vw,56px);display:grid;grid-template-columns:1fr 1.15fr;gap:clamp(28px,5vw,64px);
    align-items:center}

  .kick{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.28em;text-transform:uppercase;
    color:var(--orange);margin-bottom:14px}
  h2{font-family:'Domine',serif;font-weight:600;font-size:clamp(26px,3.4vw,42px);line-height:1.02;
    letter-spacing:-.01em}
  h2 .g{background:linear-gradient(120deg,#FAA32B,#EE164F 55%,#B0093C);-webkit-background-clip:text;
    background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
  .lede{margin-top:16px;font-size:clamp(14px,1.4vw,16px);line-height:1.55;color:rgba(253,246,235,.82);
    max-width:46ch}

  /* logos: one aligned row, relative sizing carries the hierarchy (no labels) */
  .logos{display:flex;flex-wrap:wrap;align-items:center;gap:clamp(34px,4.5vw,60px)}
  .logo{position:relative;display:inline-flex;align-items:center}
  .logo svg{display:block;width:auto;fill:var(--cream)}
  .logo svg *{fill:var(--cream)}
  .logo.big svg{height:clamp(38px,4.4vw,56px)}
  .logo.big::before{content:"";position:absolute;inset:-45% -22%;z-index:-1;
    background:radial-gradient(ellipse at center, rgba(250,163,43,.15), transparent 70%)}
  .logo.sm svg{height:clamp(26px,2.8vw,37px)}

  @media (max-width:760px){
    body{overflow:auto}
    .stage{min-height:0}
    .wrap{grid-template-columns:1fr;gap:26px;padding:34px 24px}
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="wrap">
      <div class="intro">
        <p class="kick">Our partners</p>
        <h2>Thank you to our <span class="g">sponsors.</span></h2>
        <p class="lede">Horizons is brought to life with the support of organisations at the forefront of work, people and technology &mdash; thank you for shaping the day with us.</p>
      </div>
